name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Build and tests without cgo and without the purego tag: the real client is left out
    # (meow_nocgo.go), so this covers the fake-backed tests. The race detector requires cgo; the
    # test-cgo job runs the tests with -race, test-purego covers the purego build.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

