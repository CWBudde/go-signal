# run with treefmt --allow-missing-formatter

[global]
excludes = [
  # reference implementation (git submodule)
  "reference/**",
  # go.sum & go.mod
  "go.sum",
  "go.mod",
  # gitignore
  "**/.gitignore",
  ".gitmodules",
  # written by release-please
  "CHANGELOG.md",
  ".release-please-manifest.json",
]

### Misc

[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = ["*.json", "*.md"]

### Go

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

[formatter.gci]
command = "gci"
options = ["-w"]
includes = ["*.go"]
# gci v0.14.0's standard-library list predates Go 1.26's crypto/hpke and would move it into the
# third-party group, which gofumpt (golangci-lint) then rejects.
excludes = ["internal/signal/hpke_std.go"]
priority = 1                               # run after gofumpt

### Just

[formatter.just]
command = "just"
options = ["--fmt", "--unstable", "--justfile"]
includes = ["justfile"]

### TOML

[formatter.taplo]
command = "taplo"
options = ["fmt"]
includes = ["*.toml"]

### YAML

[formatter.yamlfmt]
command = "yamlfmt"
options = ["format", "-"]
includes = ["*.yaml", "*.yml"]
