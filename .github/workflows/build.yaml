name: build

# Cross-compiles and packages the release binaries for linux, darwin and windows on amd64 and
# arm64, all on one runner: the default backend is pure Go (libsignal_go), so there is no cgo, no
# Rust and no per-OS runner. tests.yaml runs it on every push; release.yaml calls it for a tag
# and attaches the archives to the release.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build; empty builds the triggering commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Release targets use the AES assembly
        run: just check-aes-asm

      - name: Build and package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n $TAG ]]; then export VERSION=$TAG; fi
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            just build-release "${target%/*}" "${target#*/}"
          done

      - name: Install script
        run: |
          cp scripts/install.sh dist/
          sh -n dist/install.sh

      - name: Smoke test
        run: |
          dist/linux_amd64/go-signal version
          dist/linux_amd64/go-signal version | grep -qx 'backend: libsignal_go'
          # Built with the backend tag, never with purego (which drops the AES assembly, CT-02).
          go version -m dist/linux_amd64/go-signal | tee /dev/stderr | grep -q -- '-tags=libsignal_go$'

      - name: Smoke test in a scratch container
        run: just smoke-image

      - uses: actions/upload-artifact@v4
        with:
          name: release
          # The linux binaries are for the container image (release.yaml).
          path: |
            dist/go-signal_*.tar.gz
            dist/go-signal_*.zip
            dist/install.sh
            dist/linux_*/go-signal
          if-no-files-found: error
