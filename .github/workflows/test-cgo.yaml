name: test-cgo

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  cgo:
    # Builds and tests against libsignal_ffi.a. The library is cached per libsignal commit, so
    # Rust only runs when the submodule moves.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Resolve libsignal commit
        id: libsignal
        run: echo "sha=$(git rev-parse HEAD:third_party/libsignal)" >> "$GITHUB_OUTPUT"

      - name: Cache libsignal_ffi.a
        id: cache
        uses: actions/cache@v4
        with:
          path: third_party/lib
          key: libsignal-ffi-${{ runner.os }}-${{ runner.arch }}-${{ steps.libsignal.outputs.sha }}

      # Also checks out the submodule, so it runs before the toolchain install below.
      - name: Check libsignal version
        run: just check-libsignal

      - name: Install libsignal build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: third_party/libsignal
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev clang cmake
          # Installs the toolchain pinned by the submodule's rust-toolchain file.
          rustup toolchain install --profile minimal

      - name: Build libsignal_ffi.a
        run: just libsignal

      - name: Build
        run: just build

      # Coverage is taken here rather than in test-unit: only this job compiles the real
      # signalmeow client (meow*.go is cgo-only).
      - name: Run tests with coverage
        run: just test-coverage

      - name: Generate coverage report
        id: coverage
        if: always() && hashFiles('coverage.out') != ''
        run: |
          just coverage-report
          cat coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so they only see the report in the step summary.
      - name: Add coverage PR comment
        if: >-
          always() && steps.coverage.outcome == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          path: coverage-results.md
