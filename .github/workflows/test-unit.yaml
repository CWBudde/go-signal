name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Pure-Go build and tests: CGO_ENABLED=0 drops the libsignal link, so this job needs no Rust.
    # The race detector requires cgo; the test-cgo job runs the tests with -race.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build and test the purego backend
        run: |
          go build -v -tags purego ./...
          go vet -tags purego ./...
          go test -v -count=1 -tags purego ./...
