name: test-unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Linux only for now: libsignal-ffi (CGO) is not wired into CI yet.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run tests
        shell: bash
        run: go test -v -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
