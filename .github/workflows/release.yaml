name: release

# Builds the release binaries for a tag and attaches them to its GitHub release (created here
# if it doesn't exist yet), then publishes the container image, the Homebrew formula and the
# AUR package.
#
# Triggers: pushing a v* tag, a call from release-please.yaml, or a manual run for an existing tag.
#
# - build: the pure-Go (libsignal_go) binaries for linux/darwin/windows × amd64/arm64, cross-compiled
#   on one runner (build.yaml). No cgo and no Rust; the linux binaries are static.
# - release: SHA256SUMS, a build provenance attestation and the release assets.
# - image: ghcr.io/cwbudde/go-signal for linux/amd64 and linux/arm64 (scratch + static binary).
# - homebrew / aur: skipped until the HOMEBREW_TAP_TOKEN / AUR_SSH_KEY secrets are set.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (vX.Y.Z)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/cwbudde/go-signal

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum go-signal_*.tar.gz go-signal_*.zip install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/go-signal_*.tar.gz dist/go-signal_*.zip dist/install.sh dist/SHA256SUMS --clobber

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      # Artifacts don't keep file modes.
      - run: chmod +x dist/linux_*/go-signal

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Check for the tap token
        if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap"

      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          name: checksums
          path: dist

      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
        with:
          repository: cwbudde/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          path: tap

      - name: Update the formula
        if: env.TAP_TOKEN != ''
        run: |
          mkdir -p tap/Formula
          scripts/render-packaging.sh packaging/homebrew/go-signal.rb.tmpl "$TAG" dist/SHA256SUMS > tap/Formula/go-signal.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/go-signal.rb
          git diff --cached --quiet || git commit -m "go-signal ${TAG#v}"
          git push

  aur:
    needs: release
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

    steps:
      - name: Check for the AUR key
        if: env.AUR_SSH_KEY == ''
        run: echo "::notice::AUR_SSH_KEY is not set; skipping the AUR package"

      - uses: actions/checkout@v4
        if: env.AUR_SSH_KEY != ''
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        if: env.AUR_SSH_KEY != ''
        with:
          name: checksums
          path: dist

      - name: Render PKGBUILD
        if: env.AUR_SSH_KEY != ''
        run: scripts/render-packaging.sh packaging/aur/PKGBUILD.tmpl "$TAG" dist/SHA256SUMS > dist/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.AUR_SSH_KEY != ''
        with:
          pkgname: go-signal-bin
          pkgbuild: dist/PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'cwbudde' }}
          commit_email: ${{ vars.AUR_EMAIL || 'cwbudde@users.noreply.github.com' }}
          ssh_private_key: ${{ env.AUR_SSH_KEY }}
          commit_message: go-signal ${{ env.TAG }}
